runConfig:
  concurrency: 80
  minInstances: 0

# All values come from Secret Manager secrets in the active project.
# - New standalone project (magnolia-services): secrets created from the
#   project's own firebase-adminsdk service-account key + ADMIN_PASSWORD.
# - Legacy backend (magscmembership): supplies these via per-backend overrideEnv,
#   which overrides this file, so it is unaffected.
env:
  # These three are needed at BUILD time too: the service/guide pages read
  # Firestore (getLinks) during prerender, so the real content — including the
  # pre-treatment/after-care videos — gets baked into the static HTML instead of
  # falling back to defaults and only self-healing later via ISR.
  - variable: FIREBASE_PROJECT_ID
    secret: FIREBASE_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_PRIVATE_KEY_BASE64
    secret: FIREBASE_PRIVATE_KEY_BASE64
    availability:
      - BUILD
      - RUNTIME
  - variable: ADMIN_PASSWORD
    secret: ADMIN_PASSWORD
  - variable: NEXT_PUBLIC_MEMBERSHIP_URL
    value: https://magnolia-membership--magscmembership.us-east4.hosted.app
  - variable: NEXT_PUBLIC_RECORDS_API
    value: https://medspa-records-525975445938.us-west2.run.app
    availability:
      - BUILD
      - RUNTIME
  # Google phone sign-in (10-12, lib/phoneSignIn.ts) — ON since 10-12, after
  # the records console steps (Phone provider, this site an authorized domain,
  # SMS region US, "Send Verification Code per day" = 100). The RECORDS
  # project's public web config — the same values ship in its own bundle.
  # Remove these three to fall back to Twilio.
  - variable: NEXT_PUBLIC_RECORDS_FIREBASE_API_KEY
    value: AIzaSyBjtb4AufcGSS0MMydTB-a5SsIPQvzFhy4
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_RECORDS_FIREBASE_AUTH_DOMAIN
    value: medspa-reports.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_RECORDS_FIREBASE_PROJECT_ID
    value: medspa-reports
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_APP_URL
    value: https://magnolia-services--magnolia-services.us-central1.hosted.app
